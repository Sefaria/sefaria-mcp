[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sefaria-mcp"
version = "0.1.0"
description = "A FastMCP server for Sefaria"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastmcp>=4.0.3,<5",
    "hdate",
    "requests",
    "pillow",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "prometheus-fastapi-instrumentator",
    "prometheus-client"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
sefaria-mcp = "sefaria_mcp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"] 
